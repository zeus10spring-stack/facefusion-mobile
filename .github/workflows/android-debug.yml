name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check required native libraries
        run: |
          echo 'This repository does not include the required native libraries.'
          echo 'A trusted, compatible prebuiltNativeDir must be prepared before the APK build can run.'
          exit 1
